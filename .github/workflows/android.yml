name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    # Pinned rather than ubuntu-latest, so a runner image change can't break the build unannounced.
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # to publish the APK as a release
    env:
      # Builds 1–15 came from the earlier repository. Android refuses to install a lower
      # version code over a higher one, so this repository continues the count: run 2 = 0.1.16.
      VERSION_OFFSET: 14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        run: |
          CODE=$(( ${{ github.run_number }} + VERSION_OFFSET ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.$CODE" >> "$GITHUB_ENV"
          echo "Building version 0.1.$CODE (code $CODE)"

      # GitHub's Ubuntu runners come with the Android SDK installed. Accept its
      # licenses and make sure the platform this app targets is present.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" > /dev/null

      - name: Install
        run: npm ci

      - name: Test engine
        run: npm test

      - name: Build web app and copy into Android project
        run: npm run android:sync

      # Signing key: from the ANDROID_KEYSTORE_BASE64 secret when it is set, otherwise
      # the key file in android/keystore/ (never committed to this repository).
      - name: Signing key from secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 --decode > android/keystore/debug.keystore
            echo "Using the signing key from the repository secret."
          else
            echo "No secret set; using android/keystore/debug.keystore if present."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "electro-coach-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: electro-coach-apk
          path: electro-coach-*.apk
          retention-days: 30

      # One release per build, tagged v0.1.N and marked latest. The APK is always named
      # electro-coach.apk, so .../releases/latest/download/electro-coach.apk is a stable link
      # to the newest version (used by the README's download link).
      # The release notes carry the commit message under "What's new"; the app shows it in its update prompt.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cp "electro-coach-$VERSION_NAME.apk" electro-coach.apk
          {
            echo "Version $VERSION_NAME. On your Android phone, download electro-coach.apk below and open it. It installs over the previous version and keeps your data; don't uninstall to update. If you already have the app, it offers this update itself."
            if [ -n "$COMMIT_MESSAGE" ]; then
              echo; echo "## What's new"; echo
              printf '%s\n' "$COMMIT_MESSAGE"
            fi
          } > release-notes.md
          # The earlier rolling "latest" release is replaced by versioned releases.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          if gh release view "v$VERSION_NAME" > /dev/null 2>&1; then
            # A re-run of the same build: replace its APK.
            gh release upload "v$VERSION_NAME" electro-coach.apk --clobber
            exit 0
          fi
          gh release create "v$VERSION_NAME" electro-coach.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Electro-Coach $VERSION_NAME" \
            --notes-file release-notes.md