name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to publish the APK as a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners come with the Android SDK installed. Accept its
      # licences and make sure the platform this app targets is present.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" > /dev/null

      - name: Install
        run: npm ci

      - name: Test engine
        run: npm test

      - name: Build web app and copy into Android project
        run: npm run android:sync

      # Signing key: from the ANDROID_KEYSTORE_BASE64 secret when it is set (needed before
      # the repository goes public), otherwise the key file in android/keystore/.
      - name: Signing key from secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 --decode > android/keystore/debug.keystore
            echo "Using the signing key from the repository secret."
          else
            echo "No secret set; using android/keystore/debug.keystore from the repository."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk electro-coach-0.1.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk electro-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: electro-coach-apk
          path: electro-coach-0.1.*.apk
          retention-days: 30

      # One rolling release, "latest", always holds the newest APK under a fixed name,
      # so the README can link straight to it.
      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          git tag -f latest
          git push -f origin latest
          NOTES="Electro-Coach $VERSION, built from ${GITHUB_SHA::7}. Download electro-coach.apk on your Android phone and open it; it installs over the previous version and keeps your data."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Electro-Coach $VERSION" --notes "$NOTES" --latest
          else
            gh release create latest --title "Electro-Coach $VERSION" --notes "$NOTES" --latest
          fi
          gh release upload latest electro-coach.apk --clobber