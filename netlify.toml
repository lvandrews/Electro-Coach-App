# Hosted web version (iPhone: open the site in Safari, Share → Add to Home Screen).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# FargoRate lookup from the browser: FargoRate's server doesn't allow cross-site
# requests, so the site forwards them (the Android app calls FargoRate directly).
[[redirects]]
  from = "/fargo-api/*"
  to = "https://dashboard.fargorate.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
